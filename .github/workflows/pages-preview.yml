name: Afrifama concept preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build static preview
        run: bun run build
        env:
          GITHUB_PAGES_BUILD: "true"
      - name: Prepare Pages files
        run: |
          cp .output/public/index.html .output/public/404.html
          printf 'User-agent: *\nDisallow: /\n' > .output/public/robots.txt
          rm .output/public/sitemap.xml
          touch .output/public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public
      - id: deployment
        uses: actions/deploy-pages@v4
